<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾签 · 品牌动态小样</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f1ee;color:#171719;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--paper:#fff;--rail:#fafaf8;--line:#e5e5e3;--muted:#85858b;--ink:#171719;--wash:#f4f4f2}body.dark{background:#08090c;color:#ededf1;--paper:#141519;--rail:#111216;--line:#2a2b32;--muted:#94959f;--ink:#ededf1;--wash:#1b1c23}header{padding:32px 36px 24px;display:flex;align-items:end;justify-content:space-between;gap:24px}h1{font-size:25px;letter-spacing:-1px;margin:8px 0}header p{font-size:12px;color:var(--muted);margin:0;line-height:1.8}.eyebrow{font:10px monospace;letter-spacing:2px;color:var(--muted)}button{font:12px inherit;font-family:inherit;color:inherit;background:transparent;border:1px solid var(--line);padding:9px 13px;cursor:pointer}button:hover{border-color:var(--ink)}button:focus-visible{outline:2px solid #8179ee;outline-offset:3px}button[aria-pressed=true]{background:var(--ink);color:var(--paper)}.controls{display:flex;gap:6px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:0 36px 32px}.concept{background:var(--paper);border:1px solid var(--line);min-width:0}.label{display:flex;align-items:center;gap:12px;padding:20px 20px 0}.letter{font:12px monospace;border:1px solid var(--line);width:28px;height:28px;display:grid;place-items:center}.label h2{font-size:17px;margin:0}.stage{height:210px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.stage canvas{width:144px;height:144px;cursor:pointer}.stage small{position:absolute;bottom:12px;font:9px monospace;letter-spacing:1px;color:var(--muted)}.description{min-height:68px;padding:8px 20px 20px;margin:0;color:var(--muted);font-size:12px;line-height:1.8}.mock{border-top:1px solid var(--line);height:340px;display:grid;grid-template-columns:100px minmax(0,1fr);overflow:hidden;font-size:9px}.sidebar{background:var(--rail);border-right:1px solid var(--line);padding:17px 10px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:6px;margin-bottom:24px}.brand canvas{width:28px;height:28px;flex:none}.brand b{font-size:16px}.brand small{font:6px monospace;letter-spacing:1.6px;color:var(--muted);display:block;margin-top:2px}.nav{padding:9px 6px;color:var(--muted);white-space:nowrap}.nav.selected{background:var(--ink);color:var(--paper)}.nav.caption{font-size:7px;padding-top:20px}.dock{margin-top:auto;font-size:8px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}.main{min-width:0}.toolbar{height:42px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:8px}.toolbar span{color:var(--muted)}.content{padding:20px 12px}.hero{display:flex;align-items:center;gap:8px;margin-bottom:24px}.hero svg{width:24px;height:24px;flex:none}.hero b{font-size:16px}.hero small{display:block;font-size:7px;color:var(--muted);margin-top:5px}.count{margin-left:auto;font:25px monospace}.list-head{display:flex;justify-content:space-between;font-size:8px;border-bottom:1px solid var(--ink);padding-bottom:9px}.row{height:32px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;position:relative;overflow:hidden}.row i{display:grid;place-items:center;width:13px;height:13px;background:var(--wash);font-size:8px;font-style:normal;border-radius:3px}.row b{font-size:8px;min-width:49px}.row span{font-size:7px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row::after{content:'';width:35px;position:absolute;left:65px;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px);transform:translateY(-105%);transition:transform .4s}.row:hover::after{transform:translateY(0)}footer{padding:0 36px 30px;color:var(--muted);font-size:11px;line-height:1.8}.hint{margin-left:10px}.concept:hover .letter{border-color:#8d82e9}.focusbar{display:flex;justify-content:flex-end;padding:0 20px 16px}.focusbar button{font-size:10px;padding:5px 8px}body[data-focus] .grid{grid-template-columns:minmax(0,1000px);justify-content:center}body[data-focus] .concept{display:grid;grid-template-columns:1fr 1.5fr}body[data-focus] .concept:not(.focused){display:none}body[data-focus] .mock{grid-column:2;grid-row:1/6;height:440px;grid-template-columns:150px 1fr;border-left:1px solid var(--line);border-top:0}body[data-focus] .stage{height:230px}body[data-focus] .mock .content{padding:30px}body[data-focus] .mock .row{height:42px}body[data-focus] .mock .brand canvas{width:40px;height:40px}body[data-focus] .mock .brand b{font-size:20px}

</style></head><body><header><div><div class="eyebrow">PICKMARK / MOTION STUDIES</div><h1>同一套界面，三种品牌性格。</h1><p>只比较彩色标记的形态与动态。标题、数字与列表保持相同，正式插件未修改。</p></div><div class="controls"><button id="light" aria-pressed="true">浅色</button><button id="dark" aria-pressed="false">深色</button><button id="pause">暂停动画</button><button id="replay">重新播放</button><button id="all" hidden>返回并排</button></div></header><main class="grid" id="grid"></main><footer>上方是放大细节，下方是放进拾签后的实际比例。鼠标移到标记上可看轻微响应；点击「单独看」可放大界面。<br><span id="status">本地模拟小样 · 无外部请求 · 不读取标签页、书签或邮箱</span></footer>
