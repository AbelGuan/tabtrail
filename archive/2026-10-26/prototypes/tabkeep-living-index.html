function renderInspector(){const panel=$('#inspector');if(!panel)return;const r=find(cur().selected);if(!r){panel.innerHTML=`<div class="inspector-top mono">PREVIEW / EMPTY</div><div class="preview-cover">${art(null)}</div>`;return;}

function select(id,explicit=false,trigger=null){clearTimeout(hoverTimer);cur().selected=id;$$('[data-row]').forEach(r=>r.classList.toggle('selected',r.dataset.row===id));$$('[data-select].gallery-card').forEach(r=>r.classList.toggle('active',r.dataset.select===id));renderInspector();const card=$('#inspector .preview-card');card?.classList.add('preview-refresh');if(explicit&&innerWidth<=620){previewTrigger=trigger;$('#inspector').classList.add('mobile-open');$('#inspector').setAttribute('role','dialog');$('#inspector').setAttribute('aria-modal','true');$('#preview-overlay').classList.add('show');$('#inspector-close').focus();}}

function reviewHTML(){const values=[68,42,28,16],colors=['#435c43','#a4b28c','#d4bf79','#c99571'];return `<div class="summary-strip"><span class="summary-copy">${I('clock')}今日的浏览切片 <span class="subtle mono">14 PAGES / 24 MOMENTS</span></span><span class="mono" style="font-size:9px">2026.10.13</span></div><div class="review-layout"><section class="review-panel"><h2>时间分布 <span class="mono muted" style="font-size:8px">01 / DISTRIBUTION</span></h2><p class="review-value serif">2<small>h</small> 34<small>min</small></p><p class="review-sub">浏览投入 · 模拟估算</p><div class="distribution">${values.map((v,i)=>`<span style="width:${v/154*100}%;background:${colors[i]}"></span>`).join('')}</div>${values.map((v,i)=>`<p class="legend"><span><i style="--tone:${colors[i]}"></i>${groups[i]}</span><span class="mono muted">${v} min</span></p>`).join('')}</section><section class="review-panel"><h2>一天的节奏 <span class="mono muted" style="font-size:8px">02 / RHYTHM</span></h2><p class="review-value serif">${String(state.hour).padStart(2,'0')}<small>:00</small></p><p class="review-sub">选择一个小时，回看浏览路径</p><div class="bars">${[12,21,72,100,34,9,48,76,29,17,9,2].map((v,i)=>`<button class="bar ${state.hour===i+7?'active':''}" data-hour="${i+7}" style="height:${v}%" aria-label="查看 ${i+7} 点浏览路径"></button>`).join('')}</div><div class="bar-axis mono"><span>07:00</span><span>12:00</span><span>18:00</span></div><p class="review-note">空白时间不补记。这里的数字，不是专注评分。</p></section></div><section class="timeline"><div class="list-tools"><strong>思路经过的地方</strong><span class="mono muted">${state.hour}:00 — ${state.hour+1}:00</span></div>${[tabs[state.hour%6],tabs[(state.hour+1)%6],tabs[(state.hour+2)%6]].map((r,i)=>`<div class="timeline-row"><time class="mono">${state.hour}:${['04','19','42'][i]}</time><button style="text-align:left" data-open="${r.id}">${E(r.title)}</button><small class="mono">${[15,23,12][i]} min</small></div>`).join('')}</section>`;}

function modal(title,body,actions=''){clearTimeout(hoverTimer);closePreview();$('#dialog').innerHTML=`<div class="dialog-shell"><div class="dialog-kicker mono">TABKEEP / INTERACTION STUDY</div><div class="dialog-heading"><h2>${title}</h2><button class="tool" data-close aria-label="关闭对话框">${I('close')}</button></div>${body}<div class="dialog-actions">${actions||'<button class="button primary" data-close>明白了</button>'}</div></div>`;$('#dialog').showModal();}

function detail(r){modal('让它有一个位置。',`<p class="dialog-copy">${E(r.title)}</p>${r.id.startsWith('b')?`<div class="dialog-strip">原文件夹：${E(r.folder)}<br>调整智能分类不会移动这条书签。</div>`:''}<label class="field">${r.id.startsWith('b')?'智能分类':'所属工作区'}<select id="group-select">${groups.map(g=>`<option ${r.group===g?'selected':''}>${g}</option>`).join('')}</select></label><p class="dialog-copy" style="font-size:10px;margin-top:14px">人工调整会保留；刷新原型后恢复初始模拟数据。</p>`,`<button class="button" data-close>取消</button><button class="button primary" id="save-group">保存分类 ${I('right')}</button>`);$('#save-group').onclick=()=>{r.group=$('#group-select').value;r.manual=true;$('#dialog').close();render();toast('已保存模拟分类 · 原文件夹不变');};}
function classify(){const candidates=rows().filter(r=>r.group==='待整理'&&!r.manual);if(!candidates.length){toast('当前范围已经整理好，人工分类保持不变。');return;}modal(cur().view==='history'?'把遗漏的灵感，归回原处。':'为新的灵感，建立索引。',`<p class="dialog-copy">只处理当前范围中的 ${candidates.length} 条待整理记录。已有分类、人工调整${state.mode==='bookmarks'?'与原文件夹':''}保持不变。</p><div class="dialog-strip">${candidates.map(r=>E(r.title)).join('<br>')}</div><label class="check-line"><input type="checkbox" id="ai-demo">演示 AI 辅助分类</label><p class="dialog-copy" style="font-size:10px;margin-top:13px">原型仅演示结果，不调用 AI，也不发送数据。</p>`,`<button class="button" data-close>暂时放着</button><button class="button primary" id="classify-confirm">开始整理 ${I('spark')}</button>`);$('#classify-confirm').onclick=()=>{candidates.forEach((r,i)=>r.group=groups[i%3]);$('#dialog').close();if(state.mode==='bookmarks')cur().view='smart';render();toast(`已整理 ${candidates.length} 条模拟记录 · 人工调整保留`);};}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;

 else if(b.dataset.action){const a=b.dataset.action;if(a==='classify')classify();else if(a==='clear-search'){cur().q='';render();}else if(a==='reset-filter'){cur().q='';cur().filter='全部';if(cur().view==='history')state.date='2026-10-12';render();}else if(a==='restore'){if(!rows().length){toast('这个日期没有可以恢复的模拟页面。');return;}modal('重新走进，那一天。','<p class="dialog-copy">恢复当前清单中的页面，复用已经打开的标签，并保留历史分类。</p><div class="dialog-strip">此处是恢复演示，不会实际打开网页。</div>','<button class="button" data-close>取消</button><button class="button primary" id="restore-confirm">演示恢复 '+I('arrow')+'</button>');$('#restore-confirm').onclick=()=>{$('#dialog').close();toast('模拟恢复完成 · 已有标签不重复打开');};}}
