function showOpen(r){modal('页面打开演示',`<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px"><span class="favicon" style="--iconbg:${r.bg};--iconfg:${r.fg}">${esc(r.letter)}</span><strong>${esc(r.title)}</strong></div><p>${esc(r.domain)}</p><div class="mock-list">实际插件中，这里会打开书签或切换到已有标签。<br>当前是离线原型，不访问目标网站。</div>`);}
function detail(r){const bookmark=r.id.startsWith('b');modal(bookmark?'书签详情':'页面详情',`<p style="color:var(--text)">${esc(r.title)}</p><p>${esc(r.domain)}</p>${bookmark?`<div class="mock-list">原文件夹：${esc(r.folder)}<br>更改下方分类不会移动原书签。</div>`:''}<label class="field">${bookmark?'智能分类':'工作区'}<select id="edit-group">${groups.map(g=>`<option ${r.group===g?'selected':''}>${g}</option>`).join('')}</select></label><p style="margin-top:12px">人工调整将在本次原型体验中保留，刷新页面后重置。</p>`,`<button class="button" data-close>取消</button><button class="button primary" id="save-group">保存分类</button>`);$('#save-group').onclick=()=>{r.group=$('#edit-group').value;r.manual=true;$('#dialog').close();render();toast('已保存模拟分类 · 原文件夹未改变');};}
function classify(isHistory=false){const list=isHistory?history:state.mode==='bookmarks'?bookmarks:tabs;const key=state.mode==='bookmarks'&&current().view==='folders'?'folder':'group';const scope=list.filter(r=>current().query?`${r.title} ${r.domain} ${r.group} ${r.folder}`.toLowerCase().includes(current().query.toLowerCase()):current().filter==='全部'||r[key]===current().filter);const candidate=scope.filter(r=>r.group==='待整理'&&!r.manual);if(!candidate.length){toast('当前范围没有需要补分类的模拟页面');return;}modal(isHistory?'历史补分类':state.mode==='bookmarks'?'整理书签':'整理当前标签',`<p>仅整理当前范围内 ${candidate.length} 个待整理页面，保留已有分类和人工调整${state.mode==='bookmarks'?'，不修改原文件夹':''}。</p><div class="mock-list">${candidate.map(r=>esc(r.title)).join('<br>')}</div><label class="check"><input type="checkbox" id="use-ai">演示 AI 辅助分类</label><p style="margin-top:12px">只演示交互结果。不会发送任何网络请求。</p>`,`<button class="button" data-close>取消</button><button class="button primary" id="confirm-classify">确认整理</button>`);$('#confirm-classify').onclick=()=>{candidate.forEach((r,i)=>r.group=groups[i%3]);$('#dialog').close();if(state.mode==='bookmarks')current().view='smart';current().filter='全部';render();toast(`已演示完成 ${candidate.length} 个页面的分类 · 人工调整保留`);};}
function settings(){modal('外观与原型说明',`<div class="choice-row"><span>外观</span><div class="choices">${[['system','跟随系统'],['light','浅色'],['dark','深色']].map(([v,l])=>`<button data-color="${v}" class="${state.color===v?'selected':''}" aria-pressed="${state.color===v}">${l}</button>`).join('')}</div></div><div class="choice-row"><span>风格</span><div class="choices">${[['rounded','圆角'],['classic','经典']].map(([v,l])=>`<button data-style="${v}" class="${state.style===v?'selected':''}" aria-pressed="${state.style===v}">${l}</button>`).join('')}</div></div><div class="choice-row"><span>语言</span><span class="muted">中文 · 本原型版本</span></div><div class="mock-list">原插件的中英文、规则、AI 配置与隐私功能保持不变。<br>此处只演示双面板设计，不修改现有插件设置。</div><button class="button" id="reset-demo" style="margin-top:18px">重置模拟数据</button>`);$('#reset-demo').onclick=()=>location.reload();}
function applyTheme(){document.documentElement.classList.toggle('dark',state.color==='dark'||state.color==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.classList.toggle('classic',state.style==='classic');}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
function showSearch(){hidePreview();$('#query').value=current().query;$('#command').showModal();searchResults();$('#query').focus();}
function searchResults(){const query=$('#query').value.toLowerCase().trim();const list=items().filter(r=>`${r.title} ${r.domain} ${r.group} ${r.folder}`.toLowerCase().includes(query));$('#search-results').innerHTML=list.length?list.slice(0,9).map(r=>`<button class="command-result" data-search-result="${r.id}"><span class="favicon" style="--iconbg:${r.bg};--iconfg:${r.fg}">${esc(r.letter)}</span><span class="result-text"><strong>${esc(r.title)}</strong><small>${esc(state.mode==='bookmarks'?r.folder:r.group)} · ${esc(r.domain)}</small></span>${icon('arrow')}</button>`).join(''):'<div class="empty"><h2>没有找到匹配的页面</h2><p>试试“设计”“GitHub”或“周末”。</p></div>';}
$('#query').oninput=searchResults;$('#query').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();current().query=$('#query').value.trim();if(current().view==='review')current().view='workspace';$('#command').close();render();}};$('#search-close').onclick=()=>$('#command').close();$('#search-open').onclick=showSearch;
function sidebarAccess(){const hidden=innerWidth<=650&&!$('#sidebar').classList.contains('open');$('#sidebar').inert=hidden;$('#sidebar').setAttribute('aria-hidden',hidden);}
function closeSidebar(){const open=$('#sidebar').classList.contains('open');$('#sidebar').classList.remove('open');$('#scrim').hidden=true;$('#mobile-menu').setAttribute('aria-expanded','false');sidebarAccess();if(open)$('#mobile-menu').focus();}
$('#mobile-menu').onclick=()=>{$('#sidebar').classList.add('open');$('#scrim').hidden=false;$('#mobile-menu').setAttribute('aria-expanded','true');sidebarAccess();$('#sidebar .nav-item').focus();};$('#scrim').onclick=closeSidebar;
$('#home').onclick=()=>{state.mode='tabs';state.tabs.view='workspace';state.tabs.filter='全部';state.tabs.query='';render();closeSidebar();};$('#view-toggle').onclick=()=>{current().grid=!current().grid;render();};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.mode){state.mode=b.dataset.mode;render();}
 else if(b.dataset.view){current().view=b.dataset.view;current().filter='全部';current().query='';render();closeSidebar();}
 else if(b.dataset.filter){current().filter=b.dataset.filter;current().query='';render();closeSidebar();}
 else if(b.dataset.preview){showPreview(find(b.dataset.preview),b,true);}
 else if(b.dataset.open){showOpen(find(b.dataset.open));}
 else if(b.dataset.detail){detail(find(b.dataset.detail));}
 else if(b.dataset.searchResult){const r=find(b.dataset.searchResult);$('#command').close();detail(r);}
 else if(b.dataset.hour){state.hour=Number(b.dataset.hour);renderReview();}
 else if(b.hasAttribute('data-close'))$('#dialog').close();
 else if(b.dataset.color){state.color=b.dataset.color;applyTheme();b.parentElement.querySelectorAll('button').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b);});}
 else if(b.dataset.style){state.style=b.dataset.style;applyTheme();b.parentElement.querySelectorAll('button').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b);});}
 else if(b.dataset.action){const a=b.dataset.action;if(a==='settings')settings();else if(a==='about')modal('关于这个原型','<p>拾页双面板设计 · 模拟标签、书签和浏览轨迹。</p><div class="mock-list">不读取真实浏览器数据，不连接邮箱，不请求外部网站。<br>所有缩略图由内置图形绘制，并非真实页面截图。<br>刷新页面会重置本次操作。</div>');else if(a==='sync'){toast('模拟标签已同步 · 当前没有新增页面');}else if(a==='classify')classify();else if(a==='history-classify')classify(true);else if(a==='clear-search'){current().query='';render();}else if(a==='reset-filter'){current().query='';current().filter='全部';if(current().view==='history')state.date='2026-10-12';render();}else if(a==='restore'){modal('恢复历史工作现场','<p>实际插件会恢复当前清单中的页面，并跳过已经打开的网址，保留历史分类。</p><div class="mock-list">这里仅演示恢复操作，不会打开任何真实网页。</div>','<button class="button" data-close>取消</button><button class="button primary" id="restore-confirm">演示恢复</button>');$('#restore-confirm').onclick=()=>{$('#dialog').close();toast('模拟恢复完成 · 历史分类保留，已有标签不重复打开');};}}
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#dialog').open)showSearch();}if(e.key==='Escape'){if(!$('#preview').hidden){hidePreview();if(lastPreviewTrigger?.matches('button'))lastPreviewTrigger.focus();}closeSidebar();}});
window.addEventListener('resize',()=>{hidePreview();if(innerWidth>650)closeSidebar();sidebarAccess();});window.addEventListener('scroll',()=>{if(innerWidth>650)hidePreview();},{passive:true});
applyTheme();render();sidebarAccess();
</script>
</body>
</html>
