<body>
<div class="app">
 <aside class="rail" id="rail" aria-label="主导航">

  <p class="edition mono">YOUR PERSONAL INTERNET</p><nav id="nav"></nav>
  <div class="rail-bottom"><div class="archive-mark" aria-hidden="true">03<span>OFFSET</span></div><div class="rail-footer"><div><p>整理思路，留下灵感。</p><small class="mono">PROTOTYPE / VOL. 003</small></div><button id="rail-about" aria-label="关于这版设计"></button></div></div><button class="tool rail-close" id="rail-close" aria-label="关闭导航"></button>
 </aside>
 <div class="overlay" id="rail-overlay" hidden></div>
 <header class="topbar"><button class="tool mobile-menu" id="menu" aria-label="打开导航" aria-expanded="false"></button><div class="mode-switch" role="group" aria-label="切换内容来源"><button class="mode active" data-mode="tabs" aria-pressed="true"><span class="mode-number mono">01</span><strong>标签页</strong><sup class="mono">14</sup></button><button class="mode" data-mode="bookmarks" aria-pressed="false"><span class="mode-number mono">02</span><strong>书签</strong><sup class="mono">16</sup></button></div><span class="top-title" id="top-title" aria-hidden="true"></span><span class="top-caption mono">OFFSET / THE FULL EDITION</span><div class="top-tools"><button class="search-button" id="search" aria-label="搜索当前面板"><span>寻找</span><span class="key mono">⌘ K</span></button><span class="divider"></span><button class="tool" id="theme" aria-label="切换深色主题"></button><button class="tool help-tool" id="settings" aria-label="原型设置"></button></div></header>

 <footer class="statusbar mono" id="statusbar" aria-label="状态栏"></footer>
</div>
<div class="scrim-mobile" id="preview-overlay"></div>
<dialog id="dialog"></dialog>
